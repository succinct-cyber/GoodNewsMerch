<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="format-detection" content="telephone=no, date=no, address=no, email=no">
  <title>{% block title %}GoodNews Merch{% endblock %}</title>
</head>
<body style="margin:0;padding:0;background:#f9f9f9;font-family:Arial,Helvetica,sans-serif;color:#1A1C1C;">
  <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="background:#f9f9f9;padding:32px 12px;">
    <tr><td align="center">
      <table role="presentation" width="600" cellpadding="0" cellspacing="0"
             style="max-width:600px;width:100%;background:#ffffff;border:1px solid #E2E2E2;">
        <tr><td style="background:#0A0A0A;padding:28px;text-align:center;">
          <span style="color:#ffffff;font-size:20px;font-weight:700;letter-spacing:3px;">GOODNEWS MERCH</span>
        </td></tr>
        <tr><td style="padding:44px 36px;text-align:center;">
          {% block content %}{% endblock %}
        </td></tr>
        <tr><td style="background:#F9F9F9;padding:22px;text-align:center;border-top:1px solid #E2E2E2;">
          <p style="margin:0;font-size:12px;color:#6B7280;line-height:1.6;">
            {% block footer %}You received this email from GoodNews Merch.{% endblock %}<br>
            &copy; {% now "Y" %} GoodNews Merch. All rights reserved.
          </p>
        </td></tr>
      </table>
    </td></tr>
  </table>
</body>
</html>
